name: Billing Service - CI/CD (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: Release
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 01 - Restore e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Exibir versão do SDK
        run: dotnet --info

      - name: Restaurar dependências
        run: dotnet restore TechChallenge.BillingService.slnx

      - name: Compilar solução e tratar avisos como erros
        run: dotnet build TechChallenge.BillingService.slnx --configuration "$BUILD_CONFIGURATION" --no-restore --warnaserror

  tests:
    name: 02 - ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            name: Testes unitários
            filter: Category=Unit
          - suite: integration
            name: Testes de integração HTTP e Saga
            filter: Category=Integration&Category!=RabbitMq
    env:
      BILLING_TEST_RABBITMQ: 'false'
      TEST_FILTER: ${{ matrix.filter }}
      TEST_SUITE: ${{ matrix.suite }}
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore TechChallenge.BillingService.slnx

      - name: Compilar testes
        run: dotnet build TechChallenge.BillingService.slnx --configuration "$BUILD_CONFIGURATION" --no-restore --warnaserror

      - name: Executar suíte e coletar cobertura
        run: >-
          dotnet test tests/Billing.Api.Tests/Billing.Api.Tests.csproj
          --configuration "$BUILD_CONFIGURATION" --no-build --no-restore
          --filter "$TEST_FILTER"
          --logger "trx;LogFileName=$TEST_SUITE.trx"
          --results-directory "artifacts/test-results/$TEST_SUITE"
          --collect "XPlat Code Coverage" --settings tests/coverage.runsettings

      - name: Validar execução dos testes e gerar resumo
        if: always()
        shell: pwsh
        run: ./scripts/Write-TestSummary.ps1 -ResultsDirectory "artifacts/test-results/$env:TEST_SUITE" -Suite $env:TEST_SUITE

      - name: Disponibilizar relatórios TRX e cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.suite }}
          path: artifacts/test-results/${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 14

  rabbitmq:
    name: 03 - Integração com RabbitMQ real
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BILLING_TEST_RABBITMQ: 'true'
    services:
      rabbitmq:
        image: rabbitmq:4.2.9-management
        env:
          # Credenciais exclusivas do broker efêmero de teste, sem acesso a produção.
          RABBITMQ_DEFAULT_USER: billing
          RABBITMQ_DEFAULT_PASS: billing-local
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore TechChallenge.BillingService.slnx

      - name: Compilar testes
        run: dotnet build TechChallenge.BillingService.slnx --configuration "$BUILD_CONFIGURATION" --no-restore --warnaserror

      - name: Testar publicação, consumo, compensação e DLQ
        run: >-
          dotnet test tests/Billing.Api.Tests/Billing.Api.Tests.csproj
          --configuration "$BUILD_CONFIGURATION" --no-build --no-restore
          --filter "Category=RabbitMq"
          --logger "trx;LogFileName=rabbitmq.trx"
          --results-directory artifacts/test-results/rabbitmq
          --collect "XPlat Code Coverage" --settings tests/coverage.runsettings

      - name: Validar execução dos testes e gerar resumo
        if: always()
        shell: pwsh
        run: ./scripts/Write-TestSummary.ps1 -ResultsDirectory artifacts/test-results/rabbitmq -Suite rabbitmq

      - name: Exibir logs do broker em caso de falha
        if: failure()
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: docker logs "$RABBITMQ_CONTAINER_ID"

      - name: Disponibilizar relatórios TRX e cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-rabbitmq
          path: artifacts/test-results/rabbitmq/
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: SonarQube
    needs: [tests, rabbitmq]
    if: >-
      vars.SONAR_PROJECT_KEY != '' &&
      (github.ref == 'refs/heads/develop' || github.base_ref == 'develop') &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obter código e histórico Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Baixar relatórios dos testes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: artifacts/sonar-test-results

      - name: Instalar SonarScanner for .NET
        run: dotnet tool install dotnet-sonarscanner --tool-path "$RUNNER_TEMP/sonar-tools" --version 12.1.0 --allow-roll-forward

      - name: Configurar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo '::error::Cadastre SONAR_TOKEN nos secrets do GitHub Actions.'
            exit 1
          fi
          if [[ -n "$SONAR_HOST_URL" ]]; then
            destination=("/d:sonar.host.url=$SONAR_HOST_URL")
          elif [[ -n "$SONAR_ORGANIZATION" ]]; then
            destination=("/o:$SONAR_ORGANIZATION")
            if [[ -n "$SONAR_REGION" ]]; then
              destination+=("/d:sonar.region=$SONAR_REGION")
            fi
          else
            echo '::error::Configure SONAR_ORGANIZATION para Cloud ou SONAR_HOST_URL para Server.'
            exit 1
          fi
          if [[ -z "$(find artifacts/sonar-test-results -name coverage.opencover.xml -print -quit)" ]]; then
            echo '::error::Nenhum relatório de cobertura OpenCover foi encontrado.'
            exit 1
          fi
          "$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" begin \
            "/k:$SONAR_PROJECT_KEY" "${destination[@]}" "/d:sonar.token=$SONAR_TOKEN" \
            '/d:sonar.cs.opencover.reportsPaths=artifacts/sonar-test-results/**/coverage.opencover.xml' \
            '/d:sonar.cs.vstest.reportsPaths=artifacts/sonar-test-results/**/*.trx' \
            /d:sonar.scanner.scanAll=false /d:sonar.qualitygate.wait=true

      - name: Compilar para análise
        run: dotnet build TechChallenge.BillingService.slnx -c "$BUILD_CONFIGURATION" --no-incremental

      - name: Publicar análise e aguardar Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: '"$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" end "/d:sonar.token=$SONAR_TOKEN"'

  package:
    name: 04 - Publicar e validar artefato de entrega
    needs: [build, tests, rabbitmq]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências da API
        run: dotnet restore src/Billing.Api/Billing.Api.csproj

      - name: Publicar aplicação em Release
        run: >-
          dotnet publish src/Billing.Api/Billing.Api.csproj
          --configuration "$BUILD_CONFIGURATION" --no-restore
          --self-contained false -p:UseAppHost=false --output artifacts/publish

      - name: Testar inicialização e health da aplicação publicada
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Saga__Enabled: 'false'
          Saga__DatabasePath: ${{ runner.temp }}/billing-smoke/billing.db
        run: |
          dotnet artifacts/publish/Billing.Api.dll > artifacts/smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5080/health > artifacts/health.json; then
              python3 -c 'import json; assert json.load(open("artifacts/health.json"))["status"] == "healthy"'
              echo 'Aplicação publicada iniciou e respondeu healthy em /health.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat artifacts/smoke.log
              exit 1
            fi
            sleep 1
          done
          cat artifacts/smoke.log
          exit 1

      - name: Empacotar aplicação pronta para deploy
        run: tar -czf artifacts/billing-service-develop.tar.gz -C artifacts/publish .

      - name: Gerar checksum SHA256 do pacote
        working-directory: artifacts
        run: sha256sum billing-service-develop.tar.gz > billing-service-develop.tar.gz.sha256

      - name: Disponibilizar pacote de entrega
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: billing-service-develop-${{ github.sha }}
          path: |
            artifacts/billing-service-develop.tar.gz
            artifacts/billing-service-develop.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Disponibilizar diagnóstico da inicialização
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: billing-service-smoke
          path: |
            artifacts/smoke.log
            artifacts/health.json
          if-no-files-found: warn
          retention-days: 14
