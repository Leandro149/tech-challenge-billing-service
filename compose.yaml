services:
  billing:
    profiles: [billing]
    build: ./src/Billing.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Payment__Provider: ${Payment__Provider:-MercadoPago}
      MercadoPago__AccessToken: ${MercadoPago__AccessToken:-}
      MercadoPago__WebhookSecret: ${MercadoPago__WebhookSecret:-}
      RabbitMq__HostName: rabbitmq
      Saga__DatabasePath: /data/billing.db
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - billing-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.2.9-management
    hostname: billing-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: billing
      RABBITMQ_DEFAULT_PASS: billing-local
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  billing-data:
  rabbitmq-data:
